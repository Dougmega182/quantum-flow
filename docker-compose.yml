name: quantum-flow

services:
  db:
    container_name: quantumflow-db
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantum123
      POSTGRES_DB: quantum_flow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum -d quantum_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: quantumflow-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
    volumes:
      - ./backend:/code
    working_dir: /code
    ports:
      - "8005:8005"
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql+psycopg2://quantum:quantum123@db:5432/quantum_flow
      - ALLOW_ORIGINS=http://localhost:5173,https://parakeet-novel-accurately.ngrok-free.app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /code/app

  web:
    container_name: quantumflow-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8005
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src

volumes:
  pgdata:
