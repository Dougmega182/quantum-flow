name: quantum-flow-core

services:
  db:
    container_name: qf-core-db
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantum123
      POSTGRES_DB: quantum_flow
    volumes:
      - pgdata_core:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quantum -d quantum_flow" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    container_name: qf-core-api
    build:
      context: ./backend
      dockerfile: Dockerfile.core
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
    volumes:
      - ./backend:/code
    working_dir: /code
    ports:
      - "8005:8005"
    env_file:
      - ./.env
    environment:
      - PYTHONPATH=/code
      - DATABASE_URL=postgresql+psycopg2://quantum:quantum123@db:5432/quantum_flow
      - ALLOW_ORIGINS=http://localhost:5173,http://localhost:5174
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: qf-core-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8005
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src

  ngrok:
    container_name: qf-ngrok
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "http://api:8005"
      - "--url=parakeet-novel-accurately.ngrok-free.app"
    environment:
      - NGROK_AUTHTOKEN=2v51Ctml2LErcl2RTU5TcO4UJo9_5AaZckhi5w42y6ZYCoNS9
    ports:
      - "4040:4040"
    depends_on:
      - api

volumes:
  pgdata_core:
